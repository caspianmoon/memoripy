name: Apply v4 continuation payload

on:
  push:
    branches: [v4]
    paths:
      - .github/v4_payload_ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply validated payload
        run: python .github/scripts/apply_v4_continuation.py
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "complete memoripy v4 surfaces"
          git push origin HEAD:v4

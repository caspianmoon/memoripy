name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build dependencies
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Upload exact distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memoripy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

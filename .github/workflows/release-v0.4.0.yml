name: Release Memoripy v0.4.0

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.4.0.yml

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested release commit
        uses: actions/checkout@v4
        with:
          ref: bc953e4da7d8d46684307016342edabbc384925e

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Re-run release tests
        run: |
          python -m compileall -q memoripy
          python -m unittest discover -s tests -v
          python -m memoripy eval
          python -m memoripy tune benchmarks/v4_contracts.json --output retrieval-profile.json --json
          python -m memoripy compare benchmarks/v4_contracts.json --adapters memoripy --json

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          # Memoripy v0.4.0 beta

          Agent memory with receipts.

          This release rebuilds Memoripy as an evidence-first memory runtime. It adds source-aware admission controls, typed bitemporal memory, explainable retrieval receipts, corruption-safe persistence, an official MCP v2 server, authenticated tenant isolation, a browser inspector, assisted extraction with evidence validation, evaluation-driven retrieval tuning, comparison adapters, Docker deployment, and cross-platform release engineering.

          ## Proof

          - Python 3.10 through 3.13 tested across Ubuntu, Windows, and macOS
          - real MCP SDK integration tested
          - 85 tests discovered locally, with the MCP integration exercised separately in CI
          - built-in memory contracts: 5/5
          - wheel and source distribution validated with Twine

          ## Important limitations

          Model-assisted extraction quality depends on the supplied model. The hosted gateway uses API-key tenancy rather than bundling an enterprise identity provider. External comparison targets require their own services and credentials and are marked unavailable rather than assigned invented scores.
          NOTES

      - name: Create prerelease and upload verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 already exists; refusing to replace an existing release"
            exit 1
          fi
          gh release create v0.4.0 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target bc953e4da7d8d46684307016342edabbc384925e \
            --title "Memoripy v0.4.0 beta" \
            --notes-file release-notes.md \
            --prerelease

      - name: Preserve exact distributions for publishing
        uses: actions/upload-artifact@v4
        with:
          name: memoripy-v0.4.0-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memoripy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memoripy-v0.4.0-distributions
          path: dist/

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

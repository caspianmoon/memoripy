name: Compare memory systems

on:
  workflow_dispatch:
    inputs:
      adapters:
        description: Comma-separated adapters to evaluate
        default: memoripy
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password-123
        ports:
          - 7687:7687
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HINDSIGHT_BASE_URL: ${{ secrets.HINDSIGHT_BASE_URL }}
      LANGMEM_MODEL: ${{ vars.LANGMEM_MODEL }}
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requested comparison dependencies
        shell: bash
        run: |
          python -m pip install -e .
          case ",${{ inputs.adapters }}," in
            *,mem0,*) python -m pip install -e ".[mem0]" ;;
          esac
          case ",${{ inputs.adapters }}," in
            *,hindsight,*) python -m pip install -e ".[hindsight]" ;;
          esac
          case ",${{ inputs.adapters }}," in
            *,langmem,*) python -m pip install -e ".[langmem]" ;;
          esac
          case ",${{ inputs.adapters }}," in
            *,graphiti,*) python -m pip install -e ".[graphiti]" ;;
          esac
      - name: Run comparison
        run: python -m memoripy compare benchmarks/v4_contracts.json --adapters "${{ inputs.adapters }}" --json | tee comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-comparison
          path: comparison.json
